<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGAP – Dashboard Verifikator</title>
<style>
:root{--bg:#f5f5fb;--card:#fff;--ink:#1d1b3a;--mute:#6b6a85;--line:#e1e0ee;--brand:#3b3bcb;--soft:#e9e8fb;
--g:#1f8a5b;--gs:#e0f4ea;--y:#a86a00;--ys:#fdf0d2;--r:#c2272d;--rs:#fde4e4;--c1:#2b2a8c;--c2:#7a5ce0;--c3:#1aa6a0}
@media (prefers-color-scheme:dark){:root{--bg:#12112a;--card:#1b1a38;--ink:#ecebff;--mute:#a09fc4;--line:#2d2c52;--brand:#8c8cff;--soft:#2a2960;--g:#5fd3a0;--gs:#15382c;--y:#f1bd5a;--ys:#3d3114;--r:#ff7b80;--rs:#43191c;--c1:#8c8cff;--c2:#b39dff;--c3:#4fd6d0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
.wrap{max-width:1250px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:26px;margin:0}.sub{color:var(--mute);margin:2px 0 0}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;font-weight:600;background:var(--soft);color:var(--brand)}
.pill.ok{background:var(--gs);color:var(--g)}.pill.bad{background:var(--rs);color:var(--r)}
a.pill{text-decoration:none;display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.kpi b{display:block;font-size:24px;line-height:1.15}.kpi span{color:var(--mute);font-size:13px}
.ctl{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.ctl label{display:flex;gap:6px;align-items:center;color:var(--mute)}
.ctl input{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:70px}
.ctl input.s{width:150px}
.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tabs{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;border-radius:99px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.list{max-height:600px;overflow-y:auto}
.row{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;text-align:left;color:inherit;font:inherit}
.row:hover{background:var(--bg)}.row[aria-selected="true"]{background:var(--soft)}
.score{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:17px}
.Merah{background:var(--rs);color:var(--r)}.Kuning{background:var(--ys);color:var(--y)}.Hijau{background:var(--gs);color:var(--g)}
.why{color:var(--mute);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st{font-size:12px;color:var(--mute);white-space:nowrap}.st.done{color:var(--g);font-weight:600}
.detail{padding:16px}.detail h2{margin:0;font-size:20px}
.cat{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;margin-left:8px;vertical-align:middle}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line);margin:14px 0 8px}.bar i{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
h3{font-size:14px;margin:18px 0 6px}
.ev{margin:0;padding:0;list-style:none;font-size:14px}
.ev li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.ev li span:first-child{color:var(--mute)}.ev li span:last-child{text-align:right;overflow-wrap:anywhere}
.alert{background:var(--bg);border-left:3px solid var(--brand);padding:10px 12px;border-radius:6px;font-size:14px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.btn{font:inherit;font-weight:600;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.btn.ok{color:var(--g)}.btn.hold{color:var(--y)}.btn.no{color:var(--r)}.btn:hover{background:var(--bg)}
.note{font-size:12px;color:var(--mute);margin-top:12px}
.empty{padding:30px;text-align:center;color:var(--mute)}
.err{background:var(--rs);color:var(--r);border-radius:10px;padding:16px;margin-bottom:12px}
.err code{background:var(--card);padding:1px 6px;border-radius:4px;color:var(--ink)}
@media(max-width:900px){.main{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.list{max-height:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Antrean Verifikasi Klaim</h1>
  <p class="sub">Data asli dari hasil screening SIGAP. AI merekomendasi, verifikator memutuskan.</p></div>
  <div><a class="pill" href="/input">+ Periksa klaim baru</a> <span class="pill" id="conn">Menghubungkan…</span></div>
</header>
<div id="msg"></div>
<section class="kpis">
  <div class="kpi"><b id="k-total">-</b><span>Klaim dipindai</span></div>
  <div class="kpi"><b id="k-red" style="color:var(--r)">-</b><span>Risiko tinggi</span></div>
  <div class="kpi"><b id="k-yel" style="color:var(--y)">-</b><span>Review ringan</span></div>
  <div class="kpi"><b id="k-rec">-</b><span>Recall (fraud tertangkap di Merah)</span></div>
  <div class="kpi"><b id="k-pre">-</b><span>Presisi (Merah yang benar fraud)</span></div>
</section>
<div class="ctl">
  <label>Merah jika skor di atas <input type="number" id="t-red" value="70" min="0" max="100"></label>
  <label>Kuning jika skor di atas <input type="number" id="t-yel" value="30" min="0" max="100"></label>
  <label>Cari ID klaim <input class="s" id="q" placeholder="mis. K-00428"></label>
  <span style="color:var(--mute)" id="fpr"></span>
</div>
<div class="main">
  <section class="panel"><div class="tabs" id="tabs"></div><div class="list" id="list"></div></section>
  <aside class="panel detail" id="detail"><div class="empty">Memuat data…</div></aside>
</div>
</div>
<script>
// Jika dibuka lewat http://127.0.0.1:8000 maka API="" (alamat yang sama).
// Jika dibuka dengan klik dua kali (file://) maka memakai alamat server lokal.
const API=location.protocol.startsWith("http")?"":"http://127.0.0.1:8000";
const MAXROWS=300;
let DATA=[],filter="Semua",sel=null,q="",DEC={},EV=null,evTimer=null;
try{DEC=JSON.parse(localStorage.getItem("sigap_dec")||"{}")}catch(e){}
const $=id=>document.getElementById(id);
const num=(v,d=0)=>v==null||isNaN(v)?"-":Number(v).toLocaleString("id-ID",{maximumFractionDigits:d});
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function thr(){return{r:+$("t-red").value,y:+$("t-yel").value}}
function cat(c,t){return c.risk_score>t.r?"Merah":c.risk_score>t.y?"Kuning":"Hijau"}
const LAB={Merah:"Risiko tinggi",Kuning:"Review ringan",Hijau:"Aman"};

async function load(){
  try{
    const res=await fetch(API+"/api/v1/dashboard/feed");
    if(!res.ok)throw new Error("HTTP "+res.status);
    const j=await res.json();
    if(!j.data)throw new Error(j.message||"Respons tidak berisi data");
    DATA=j.data.sort((a,b)=>b.risk_score-a.risk_score);
    $("conn").textContent="Terhubung • "+num(DATA.length)+" klaim di antrean";$("conn").className="pill ok";
    sel=DATA[0]?.ID_Klaim;render();loadEval();
  }catch(e){
    $("conn").textContent="Tidak terhubung";$("conn").className="pill bad";
    $("msg").innerHTML=`<div class="err"><b>Tidak bisa mengambil data.</b> (${esc(e.message)})<br>
    Pastikan server berjalan: <code>uvicorn main:app --reload</code>, pipeline sudah dijalankan
    (<code>data/out/dashboard_feed.json</code> ada), lalu muat ulang halaman ini.</div>`;
    $("detail").innerHTML='<div class="empty">Belum ada data.</div>';
  }
}
async function loadEval(){
  const t=thr();
  try{const r=await fetch(`${API}/api/v1/evaluation?red=${t.r}&yel=${t.y}`);EV=await r.json()}catch(e){EV=null}
  kpis(t);
}
function kpis(t){
  const pc=v=>v==null?"-":(v*100).toFixed(1)+"%";
  if(EV&&!EV.error){
    $("k-total").textContent=num(EV.total);$("k-red").textContent=num(EV.red);$("k-yel").textContent=num(EV.yellow);
    $("k-rec").textContent=pc(EV.recall);$("k-pre").textContent=pc(EV.precision);
    $("fpr").textContent=`False positive rate: ${pc(EV.fpr)} • Recall Merah+Kuning: ${pc(EV.recall_flag)} (dari ${num(EV.labeled)} klaim berlabel)`;
  }else{
    // cadangan jika endpoint evaluasi belum ada: hitung dari antrean saja
    $("k-total").textContent=num(DATA.length);
    $("k-red").textContent=num(DATA.filter(c=>cat(c,t)==="Merah").length);
    $("k-yel").textContent=num(DATA.filter(c=>cat(c,t)==="Kuning").length);
    $("k-rec").textContent="-";$("k-pre").textContent="-";
    $("fpr").textContent="Metrik evaluasi belum tersedia (endpoint /api/v1/evaluation tidak ditemukan).";
  }
}
function tabs(t){
  const cnt={Semua:DATA.length,Merah:0,Kuning:0,Hijau:0};DATA.forEach(c=>cnt[cat(c,t)]++);
  $("tabs").innerHTML=["Semua","Merah","Kuning","Hijau"].map(o=>
    `<button class="tab" aria-pressed="${o===filter}" data-f="${o}">${o==="Semua"?"Semua":LAB[o]} (${num(cnt[o])})</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
}
function list(t){
  const rows=DATA.filter(c=>(filter==="Semua"||cat(c,t)===filter)&&(!q||String(c.ID_Klaim).toLowerCase().includes(q)));
  const shown=rows.slice(0,MAXROWS);
  $("list").innerHTML=shown.length?shown.map(c=>`<button class="row" aria-selected="${c.ID_Klaim===sel}" data-id="${esc(c.ID_Klaim)}">
    <div class="score ${cat(c,t)}">${num(c.risk_score,0)}</div>
    <div><b>${esc(c.ID_Klaim)}</b> <span style="color:var(--mute)">• ${esc(c.Kode_Faskes)}</span><div class="why">${esc(c.xai_reason)}</div></div>
    <div class="st ${DEC[c.ID_Klaim]?"done":""}">${DEC[c.ID_Klaim]||"Menunggu"}</div></button>`).join("")
    +(rows.length>MAXROWS?`<div class="empty">Menampilkan ${MAXROWS} teratas dari ${num(rows.length)} klaim. Gunakan pencarian untuk klaim lain.</div>`:"")
    :`<div class="empty">Tidak ada klaim yang cocok.</div>`;
  $("list").querySelectorAll(".row").forEach(r=>r.onclick=()=>{sel=r.dataset.id;render()});
}
function detail(t){
  const c=DATA.find(x=>String(x.ID_Klaim)===String(sel));
  if(!c){$("detail").innerHTML='<div class="empty">Pilih klaim di sebelah kiri.</div>';return}
  const rule=c.rule_penalty||0,syn=c.syndicate_score||0,rest=Math.max(0,c.risk_score-rule-syn),ct=cat(c,t);
  const parts=[[rule,"Aturan","--c1"],[syn,"Jaringan (sindikat)","--c2"],[rest,"Anomali (waktu + ML)","--c3"]];
  const bar=parts.map(p=>p[0]>0?`<i style="width:${p[0]}%;background:var(${p[2]})"></i>`:"").join("");
  const leg=parts.map(p=>`<span style="--c:var(${p[2]})">${p[1]}: <b style="color:var(--ink)">${num(p[0],1)}</b></span>`).join("");
  const hasPrev=c.Lat_Faskes_1!=null;
  const when=c.Timestamp?new Date(c.Timestamp).toLocaleString("id-ID"):"-";
  const trav=hasPrev?`<li><span>Jarak dari klaim sebelumnya</span><span>${num(c.distance_km,0)} km</span></li>
    <li><span>Selisih waktu</span><span>${num(c.time_delta_hours,1)} jam</span></li>
    <li><span>Kecepatan perpindahan</span><span>${num(c.speed_kmh,0)} km/jam</span></li>`
    :`<li><span>Perpindahan</span><span>Tidak ada klaim sebelumnya untuk dibandingkan</span></li>`;
  $("detail").innerHTML=`
   <h2>${esc(c.ID_Klaim)}<span class="cat ${ct}">${LAB[ct]} • skor ${num(c.risk_score,1)}/100</span></h2>
   <div class="bar">${bar}</div><div class="legend">${leg}</div>
   <h3>Alasan penandaan (Explainable AI)</h3><div class="alert">${esc(c.xai_reason)}</div>
   <h3>Jejak bukti</h3><ul class="ev">
     <li><span>Status kepesertaan</span><span>${esc(c.Status_Aktif)}</span></li>${trav}
     <li><span>NIK terhubung ke No. HP ini</span><span>${num(c.unique_nik_count)}</span></li>
     <li><span>Skor anomali (Isolation Forest)</span><span>${num(c.anomaly_score,3)}</span></li></ul>
   <h3>Data klaim</h3><ul class="ev">
     <li><span>NIK (hash)</span><span>${esc(c.NIK_Hash)}</span></li><li><span>No. kartu</span><span>${esc(c.No_Kartu)}</span></li>
     <li><span>No. HP terdaftar</span><span>${esc(c.No_HP_Daftar)}</span></li><li><span>Faskes</span><span>${esc(c.Kode_Faskes)}</span></li>
     <li><span>Diagnosis (ICD-10)</span><span>${esc(c["ICD-10"])}</span></li><li><span>Waktu klaim</span><span>${when}</span></li>
     <li><span>Label sintetis (kunci jawaban)</span><span>${c.label===1?"Fraud":c.label===0?"Normal":"-"}</span></li></ul>
   <div class="acts"><button class="btn ok" data-d="Disetujui">Setujui</button>
     <button class="btn hold" data-d="Ditahan">Tahan</button><button class="btn no" data-d="Ditolak">Tolak</button></div>
   <p class="note">${DEC[c.ID_Klaim]?"Keputusan tercatat: "+DEC[c.ID_Klaim]+". Bisa diubah.":"AI tidak pernah membatalkan klaim otomatis. Pembayaran hanya berubah setelah verifikator memutuskan."}</p>`;
  $("detail").querySelectorAll(".btn").forEach(b=>b.onclick=()=>{
    DEC[c.ID_Klaim]=b.dataset.d;try{localStorage.setItem("sigap_dec",JSON.stringify(DEC))}catch(e){}render()});
}
function render(){const t=thr();kpis(t);tabs(t);list(t);detail(t)}
$("t-red").oninput=$("t-yel").oninput=()=>{if(DATA.length){render();clearTimeout(evTimer);evTimer=setTimeout(loadEval,300)}};
$("q").oninput=e=>{q=e.target.value.trim().toLowerCase();if(DATA.length)render()};
load();
</script>
</body>
</html>
